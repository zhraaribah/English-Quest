<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listening Lake | English Quest</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            🌍 English<span>Quest</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="quest.html">Quest Map</a>
            <a href="achievements.html">Achievements 🏆</a>
        </nav>

        <div class="xp-display">
            ⭐ <span id="listening-xp">0</span> XP
        </div>

    </header>


    <main class="quiz-page">

        <div class="quiz-container">

            <div class="quiz-top">

                <span>🎧 LEVEL 3</span>

                <h1>Listening Lake</h1>

                <p>
                    Listen carefully and choose the correct answer!
                </p>

            </div>


            <div class="progress-info">

                <span id="listening-question-number">
                    Question 1 / 5
                </span>

                <span id="listening-score">
                    Score: 0
                </span>

            </div>


            <div class="progress-bar">

                <div id="listening-progress"></div>

            </div>


            <div class="question-card">

                <div class="question-icon">
                    🎧
                </div>

                <h2>
                    Listen to the sentence
                </h2>


                <button
                    class="listen-button"
                    onclick="playListeningAudio()"
                >
                    🔊 Play Audio
                </button>


                <p class="listen-hint">
                    Listen carefully, then choose the meaning.
                </p>


                <div
                    id="listening-answers"
                    class="answers"
                ></div>


                <p id="listening-feedback"></p>

            </div>


            <button
                id="listening-next-button"
                class="next-button"
                onclick="nextListeningQuestion()"
                style="display:none;"
            >
                Next Question →
            </button>

        </div>

    </main>


    <footer>

        <h3>🌍 EnglishQuest</h3>

        <p>
            Learn English. Complete Missions. Become a Master!
        </p>

    </footer>


    <script src="script.js"></script>


<script>
    startListeningQuiz();
</script>


</body>

</html>
